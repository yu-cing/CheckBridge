<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>橋梁構件語音確認表</title>
<style>
:root{--bg:#f5f6f8;--fg:#1c2230;--card:#fff;--mut:#6b7385;--ac:#1d5fd1;--ok:#1b8a4b;--okbg:#e2f4e9;--warn:#b25b00;--bd:#dfe3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--fg:#e8ecf4;--card:#1a2030;--mut:#98a1b5;--ac:#6ea2ff;--ok:#5fd18d;--okbg:#17342a;--warn:#ffb15c;--bd:#2b3347;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141c;--fg:#e8ecf4;--card:#1a2030;--mut:#98a1b5;--ac:#6ea2ff;--ok:#5fd18d;--okbg:#17342a;--warn:#ffb15c;--bd:#2b3347;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;padding-bottom:120px}
header{padding:14px 16px 8px}
h1{font-size:18px;margin:0 0 8px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.prog{font-size:14px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 16px;padding:14px}
.step{font-size:13px;color:var(--mut);margin-bottom:4px}
.big{font-size:26px;font-weight:700;min-height:36px;word-break:break-all}
.big.cand{color:var(--ac)}
.msg{font-size:14px;margin-top:6px;min-height:20px;color:var(--warn)}
.heard{font-size:14px;color:var(--mut);margin-top:6px;min-height:20px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;min-height:44px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button[hidden]{display:none}
.grp{margin:10px 16px}
.gh{font-weight:600;padding:6px 2px;display:flex;justify-content:space-between;align-items:center}
.gh small{color:var(--mut);font-weight:400}
.gh.sel{color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 10px;min-width:92px}
.chip b{display:block;font-size:16px}
.chip span{font-size:12px;color:var(--mut)}
.chip.done{background:var(--okbg);border-color:var(--ok)}
.chip.done b::before{content:"✓ ";color:var(--ok)}
.chip.hit{outline:3px solid var(--ac)}
.mic{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.mic .go{flex:1;font-size:18px;font-weight:700;min-height:54px}
.mic .go.on{background:#d33;border-color:#d33}
label.sp{font-size:13px;color:var(--mut);display:flex;gap:4px;align-items:center}
.tools{margin:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
dialog{width:min(92vw,520px);border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--fg);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
textarea{width:100%;height:220px;font:14px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
</style>
</head>
<body>
<header>
  <h1>橋梁構件語音確認表</h1>
  <div class="bar"><i id="bar"></i></div>
  <div class="prog"><span id="pt">0 / 0</span><span id="pp">0%</span></div>
</header>

<div class="card">
  <div class="step" id="step">請先按「匯入清單」貼上構件，再按「開始語音」</div>
  <div class="big" id="big">—</div>
  <div class="heard" id="heard"></div>
  <div class="msg" id="msg"></div>
  <div class="row" id="picks"></div>
  <div class="row">
    <button class="p" id="yes" hidden>✔ 確認</button>
    <button id="no" hidden>✖ 重說</button>
    <button id="chg" hidden>換構件名稱</button>
    <button id="undo" hidden>↩ 復原上一筆</button>
  </div>
</div>

<div class="tools">
  <button id="imp">匯入清單</button>
  <button id="exp">複製結果</button>
  <button id="rst">全部重置</button>
</div>
<div id="list"></div>

<div class="mic">
  <button class="go p" id="go">🎤 開始語音</button>
  <label class="sp"><input type="checkbox" id="tts" checked>語音回報</label>
</div>

<dialog id="dlg">
  <div id="dt" style="font-weight:600;margin-bottom:6px"></div>
  <div id="dh" style="font-size:13px;color:var(--mut);margin-bottom:8px"></div>
  <textarea id="ta"></textarea>
  <div class="row">
    <button class="p" id="dok">確定</button>
    <button id="dcl">關閉</button>
  </div>
</dialog>

<script>
const SAMPLE="";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let aliases={},pendAl=null,lastRec=null,items=[],sel=null,cand=null,state='name',active=false,rec=null,hit=null;

function load(){
  try{const d=JSON.parse(localStorage.getItem('bridge-v3')||'null');if(d&&d.items){items=d.items;sel=d.sel||null;aliases=d.al||{};return}}catch(e){}
  items=parse(SAMPLE);
}
function save(){try{localStorage.setItem('bridge-v3',JSON.stringify({items,sel,al:aliases}))}catch(e){}}
function parse(t){
  const out=[];let sec='';
  t.split(/\r?\n/).forEach(l=>{
    const p=l.split(/[,\t，]/).map(x=>x.trim());
    if(p[0])out.push({n:p[0],i:p[1]||'',s:sec,t:p[2]&&p[2]!=='未執行'?p[2]:null});
  });
  return out;
}

/* ---------- 文字正規化與比對 ---------- */
const DG={'〇':0,'零':0,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cnNum(s){let n=0,c0=0;for(const c of s){if(c==='百'){n+=(c0||1)*100;c0=0}else if(c==='十'){n+=(c0||1)*10;c0=0}else c0=DG[c]}return n+c0}
function norm(s){
  return String(s).replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[〇零一二兩三四五六七八九十百]*[十百][〇零一二兩三四五六七八九十百]*/g,cnNum).replace(/[〇零一二兩三四五六七八九]/g,c=>DG[c])
    .replace(/槓|杠|減|橫線|dash/gi,'')
    .replace(/[渣砟楂查]/g,'碴').replace(/臺/g,'台').replace(/樑/g,'梁').replace(/版/g,'板').replace(/檔/g,'擋')
    .toUpperCase().replace(/[\s\-_－—–.,，。、]/g,'');
}
function grams(s){if(s.length<2)return[s];const g=[];for(let i=0;i<s.length-1;i++)g.push(s.slice(i,i+2));return g}
function dice(a,b){
  const x=grams(a),y=grams(b);let n=0;const u=y.slice();
  x.forEach(g=>{const k=u.indexOf(g);if(k>-1){n++;u.splice(k,1)}});
  return 2*n/(x.length+y.length);
}
function lev(a,b){
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}
  for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function ov(a,b){const x=[...new Set(a)],y=new Set(b);let n=0;x.forEach(c=>{if(y.has(c))n++});return n/Math.max(a.length,b.length)}
function matchName(t){
  const q=norm(t);if(!q)return null;
  const names=[...new Set(items.map(x=>x.n))];
  let best=null,bs=0;
  names.forEach(n=>{
    const k=norm(n);let s=q===k?2:q.includes(k)?1+k.length/100:k.includes(q)?0.9-k.length/1000:Math.max(dice(q,k),ov(q,k));
    if(s>bs){bs=s;best=n}
  });
  return bs>=0.4?best:null;
}
function matchId(t){
  const q=norm(t);if(!q)return null;
  const pool=items.filter(x=>x.n===sel);
  let hits=pool.filter(x=>q.includes(norm(x.i)));
  if(hits.length)return hits.sort((a,b)=>norm(b.i).length-norm(a.i).length)[0];
  hits=pool.filter(x=>q.length>=2&&norm(x.i).includes(q));
  if(hits.length===1)return hits[0];
  let best=null,bd=9;
  pool.forEach(x=>{const k=norm(x.i);const d=Math.min(lev(q,k),...[0].map(()=>9));
    const d2=q.length>k.length?Math.min(...Array.from({length:q.length-k.length+1},(_,s)=>lev(q.slice(s,s+k.length),k))):d;
    const dd=Math.min(d,d2);if(dd<bd){bd=dd;best=x}});
  return bd<=1?best:null;
}
const isNo=t=>/不對|不是|錯|取消|重來|重說|否/.test(t);
const isYes=t=>/^(對|隊|兌|是|好|確認|沒錯|正確|OK|ok|嗯|恩)/.test(t.trim())||/確認|沒錯|正確|是的|對的/.test(t);
const isChg=t=>/換構件|換名稱|換類別|回上一步/.test(t);

/* ---------- 一次說出名稱＋編號 ---------- */
const NOISE=/[皮批屁披匹愛思艾斯衣依醫伊而爾山衫是死無舞午伍路露陸漆妻期柒爸吧巴捌久酒玖玲靈洞幺拐]/g;
const HOM={衣:1,依:1,醫:1,伊:1,幺:1,而:2,爾:2,山:3,衫:3,是:4,死:4,無:5,舞:5,午:5,伍:5,路:6,露:6,陸:6,漆:7,妻:7,期:7,柒:7,拐:7,爸:8,吧:8,巴:8,捌:8,久:9,酒:9,玖:9,玲:0,靈:0,洞:0};
const hom=s=>s.replace(/[\u4e00-\u9fff]/g,c=>HOM[c]!==undefined?HOM[c]:'');
const strip=s=>s.replace(/[A-Z0-9]/g,'').replace(NOISE,'');
const ALIAS={};
Object.entries({
 主梁:'主良,主量,竹梁,祝梁,煮梁,主涼',
 橋台:'橋抬,橋太,僑台,巧台',
 橋台基礎:'橋抬基礎,橋台機組,橋台基出,僑台基礎',
 橋墩:'橋敦,橋頓,橋盾,僑墩,橋蹲',
 橋墩基礎:'橋敦基礎,橋墩機組,橋墩基出,僑墩基礎',
 支承:'支撐,之成,支成,支稱,知成,支乘,支程',
 橫隔梁:'橫格梁,橫隔量,橫鬲梁,恆隔梁,橫各梁,橫隔良,衡隔梁',
 橋面板:'橋面班,橋麵板,僑面板,橋面半',
 橋墩保護措施:'橋墩保護設施,橋墩保護工,橋墩保護,橋墩保護措',
 擋碴牆:'擋差牆,擋茶牆,擋察牆,當碴牆,當擦牆,擋擦牆,擋槽牆',
 無道碴道床:'無碴道床,無道碴軌道,無道岔道床,吳道碴道床,武道碴道床,五道碴道床,無道碴到床',
 排水設施:'排水設備,排水社施,排水設置,排水涉施,排水設時',
 河道:'河到,何道,河盜,和道,合道,河倒',
 護床工:'護床公,護床功,護床攻,互床工,護創工,護船工,護床宮,護床供',
 伸縮縫:'伸縮封,伸縮風,伸縮鋒,伸縮逢,申縮縫,身縮縫,伸縮蜂',
 人行道板:'人行道班,人行道半,人形道板,人行道扮,人行到板'
}).forEach(([n,l])=>l.split(',').forEach(a=>{ALIAS[norm(a)]=n}));
function matchAll(t){
  const q=norm(t);if(!q)return null;
  let names=[...new Set(items.map(x=>x.n))].filter(n=>q.includes(norm(n))).sort((a,b)=>norm(b).length-norm(a).length);let fz=false,pa=null,rk=null;
  {const bk=Object.keys(ALIAS).filter(k=>q.includes(k)&&items.some(x=>x.n===ALIAS[k])).sort((a,b)=>b.length-a.length)[0];
   if(bk&&(!names.length||bk.length>norm(names[0]).length)){names=[ALIAS[bk]];rk=bk}}
  if(!names.length){const qs=strip(q);const ak=Object.keys(aliases).find(k=>k&&qs.includes(k)&&items.some(x=>x.n===aliases[k]));if(ak)names=[aliases[ak]];else{const f=qs?matchName(qs):null;if(f){names=[f];fz=true;pa={k:qs,n:f}}}}
  const exactIn=(pool,s)=>{const h=pool.filter(x=>x.i&&s.includes(norm(x.i)));return h.length?h.sort((a,b)=>norm(b.i).length-norm(a.i).length)[0]:null};
  if(names.length){
    const nm=names[0],rest=q.split(rk||norm(nm)).join(''),pool=items.filter(x=>x.n===nm);
    const bare=pool.find(x=>!x.i);if(bare&&pool.length===1)return{it:bare,exact:!fz,pa};
    const e=exactIn(pool,rest)||byDigits(pool,rest);if(e)return{it:e,exact:!fz,pa};
    let best=null,bd=9;pool.forEach(x=>{const d=lev(rest,norm(x.i));if(d<bd){bd=d;best=x}});
    return rest&&bd<=1?{it:best,exact:false}:null;
  }
  if(sel){const sp=items.filter(x=>x.n===sel);const e=exactIn(sp,q)||byDigits(sp,q);if(e)return{it:e,exact:!/[\u4e00-\u9fff]/.test(q)}}
  const h=items.filter(x=>x.i&&q.includes(norm(x.i)));
  if(!h.length){const dd=hom(q).replace(/\D/g,'');const cs=dd?items.filter(x=>x.i&&norm(x.i).replace(/\D/g,'')===dd):[];return cs.length?{pick:cs,pa:{k:strip(q)}}:null}
  const mx=Math.max(...h.map(x=>norm(x.i).length)),top=h.filter(x=>norm(x.i).length===mx);
  return top.length===1?{it:top[0],exact:true}:{pick:top};
}
function byDigits(pool,s){const d=hom(s).replace(/\D/g,'');if(!d)return null;const h=pool.filter(x=>x.i&&norm(x.i).replace(/\D/g,'')===d);if(h.length===1)return h[0];
  for(let i=1;i<d.length;i++){const g=pool.filter(x=>x.i&&norm(x.i).replace(/\D/g,'')===d.slice(i));if(g.length===1)return g[0]}
  return null}
function clearPicks(){const b=$('#picks');if(b)b.innerHTML=''}
function showPicks(list,pa){
  const box=$('#picks');box.innerHTML='';
  list.slice(0,6).forEach(it=>{const b=document.createElement('button');b.textContent=it.n+(it.i?' '+it.i:'');
    b.onclick=()=>{if(pa&&pa.k&&pa.k.length<=8)aliases[pa.k]=it.n;clearPicks();sel=it.n;cand=it;confirmId()};box.appendChild(b)});
  setMsg('沒辨識到構件名稱，請點選正確的項目');say('請點選畫面上的選項');
}
function dump(){let p=null;const o=[];items.forEach(x=>{if(x.s&&x.s!==p){o.push(x.s);p=x.s}o.push([x.n,x.i,x.t||'未執行'].join(','))});return o.join('\n')}
function undo(){const r=lastRec;if(!r)return;r.it.t=r.was;lastRec=null;hit=null;save();render();setMsg('已復原 '+r.it.n+' '+r.it.i);say('已復原');ui()}

/* ---------- 流程 ---------- */
function say(t){
  if(!$('#tts').checked||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';speechSynthesis.speak(u)}catch(e){}
}
function setMsg(t){$('#msg').textContent=t||''}
function ui(){
  const s=$('#step'),b=$('#big');
  const showBtn=(state==='nameC'||state==='idC');
  $('#yes').hidden=!showBtn;$('#no').hidden=!showBtn;$('#chg').hidden=!(state==='id'||state==='idC');$('#undo').hidden=!(lastRec&&!showBtn);
  b.classList.toggle('cand',showBtn);
  if(state==='name'){s.textContent='請直接說「構件名稱＋編號」';b.textContent=active?'例如：橋墩 P 零一':'—'}
  if(state==='nameC'){s.textContent='請確認構件名稱（說「對」或按確認）';b.textContent=cand}
  if(state==='id'){s.textContent='目前構件「'+sel+'」，可只說編號，或連名稱一起說';b.textContent=active?'請說編號':'—'}
  if(state==='idC'){s.textContent='請確認編號（說「對」或按確認）';b.textContent=sel+'　'+cand.i}
}
function onFinal(t,alts){alts=alts&&alts.length?alts:[t];clearPicks();
  setMsg('');
  if(state==='name'||state==='id'){
    if(isNo(t)&&lastRec){undo();return}
    const rs=alts.map(a=>matchAll(a));let r=rs[0];
    if(!(r&&r.it&&r.exact)){const a=rs.find(x=>x&&x.it&&x.exact);if(a)r={it:a.it,exact:false,pa:a.pa};else if(!(r&&(r.it||r.pick)))r=rs.find(x=>x&&x.it)||rs.find(x=>x&&x.pick)||null}
    if(r&&r.it)pendAl=r.pa&&r.pa.n?{k:r.pa.k,n:r.pa.n,it:r.it}:null;
    if(r&&r.it){sel=r.it.n;cand=r.it;if(r.exact){confirmId()}else{state='idC';ui();say((r.it.i?'編號，'+r.it.i.split('').join(' '):r.it.n)+'，對嗎？')}return}
    if(r&&r.pick){showPicks(r.pick,r.pa);return}
  }
  if(isChg(t)&&(state==='id'||state==='idC')){state='name';cand=null;ui();say('請說構件名稱');return}
  if(state==='name'||state==='nameC'){
    if(state==='nameC'){
      if(isNo(t)){state='name';cand=null;ui();say('請重說構件名稱');return}
      if(isYes(t)){confirmName();return}
    }
    const m=matchName(t);
    if(m){cand=m;state='nameC';ui();say('構件名稱，'+m+'，對嗎？')}
    else{setMsg('沒有比對到構件名稱，請再說一次');say('沒有聽懂，請再說一次')}
  }else{
    if(state==='idC'){
      if(isNo(t)){state='id';cand=null;ui();say('請重說編號');return}
      if(isYes(t)){confirmId();return}
    }
    const m=matchId(t);
    if(m){cand=m;state='idC';ui();say('編號，'+m.i.split('').join(' ')+'，對嗎？')}
    else{setMsg('沒有比對到「'+sel+'」的編號，請再說一次');say('沒有聽懂編號')}
  }
}
function confirmName(){sel=cand;cand=null;state='id';save();render();ui();say('請說編號')}
function confirmId(){
  const it=cand;lastRec={it,was:it.t};
  if(it.t){setMsg('此構件先前已記錄於 '+it.t)}
  else{it.t=new Date().toLocaleTimeString('zh-TW',{hour12:false});}
  if(pendAl&&pendAl.it===it&&pendAl.k&&pendAl.k.length<=8)aliases[pendAl.k]=pendAl.n;pendAl=null;clearPicks();hit=it;save();render();
  if(!lastRec.was)setMsg('✓ 已記錄 '+it.n+' '+it.i+'（說「取消」可復原）');
  say((it.i?it.i.split('').join(' '):it.n)+'，已記錄');
  cand=null;state='id';ui();
  setTimeout(()=>{hit=null;render()},2500);
}
$('#yes').onclick=()=>{state==='nameC'?confirmName():state==='idC'&&confirmId()};
$('#no').onclick=()=>{cand=null;state=state==='nameC'?'name':'id';ui()};
$('#chg').onclick=()=>{state='name';cand=null;ui()};
$('#undo').onclick=undo;

/* ---------- 語音辨識 ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function start(){
  if(!SR){setMsg('此瀏覽器不支援語音辨識，請改用 Chrome 或 Safari，或直接點選下方構件。');return}
  rec=new SR();rec.lang='zh-TW';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=5;
  rec.onresult=e=>{
    let t='',fin=false;const parts=[];
    for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true;parts.push(Array.from(e.results[i]).map(a=>a.transcript))}
    $('#heard').textContent='聽到：'+t;
    if(fin){const alts=[];for(let k=0;k<5;k++)alts.push(parts.map(q=>q[k]||q[0]).join(''));onFinal(t,[...new Set(alts)])}
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){active=false;setMsg('麥克風權限被拒絕，請在瀏覽器設定中允許。');toggleUI()}
  };
  rec.onend=()=>{if(active)setTimeout(()=>{try{rec.start()}catch(e){}},250);else toggleUI()};
  try{rec.start()}catch(e){}
}
function toggleUI(){const g=$('#go');g.classList.toggle('on',active);g.textContent=active?'■ 停止語音':'🎤 開始語音';ui()}
$('#go').onclick=()=>{
  if(active){active=false;try{rec.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}toggleUI();return}
  active=true;toggleUI();start();
  say('請說構件名稱與編號');
};

/* ---------- 顯示 ---------- */
function render(){
  const done=items.filter(x=>x.t).length,tot=items.length,pc=tot?Math.round(done*100/tot):0;
  $('#bar').style.width=pc+'%';$('#pt').textContent='已完成 '+done+' / '+tot;$('#pp').textContent=pc+'%';
  const g={};items.forEach(x=>(g[x.n]=g[x.n]||[]).push(x));let ps=null;
  $('#list').innerHTML=Object.keys(g).map(n=>{
    const d=g[n].filter(x=>x.t).length;const s=g[n][0].s||'';const sh=(s&&s!==ps)?'<div style="margin:14px 16px 0;font-size:13px;color:var(--mut)">▍'+esc(s)+'</div>':'';if(s)ps=s;
    return sh+'<div class="grp"><div class="gh'+(n===sel?' sel':'')+'" data-n="'+esc(n)+'"><span>'+esc(n)+(n===sel?'（目前）':'')+'</span><small>'+d+' / '+g[n].length+'</small></div><div class="chips">'+
      g[n].map(x=>'<div class="chip'+(x.t?' done':'')+(x===hit?' hit':'')+'" data-n="'+esc(x.n)+'" data-i="'+esc(x.i)+'"><b>'+esc(x.i||x.n)+'</b><span>'+(x.t?esc(x.t):'未執行')+'</span></div>').join('')+'</div></div>';
  }).join('')||'<div class="card">尚無清單，請按「匯入清單」。</div>';
}
$('#list').onclick=e=>{
  const c=e.target.closest('.chip');
  if(c){const it=items.find(x=>x.n===c.dataset.n&&x.i===c.dataset.i);
    if(it){it.t=it.t?null:new Date().toLocaleTimeString('zh-TW',{hour12:false});save();render()}return}
  const h=e.target.closest('.gh');
  if(h){sel=h.dataset.n;state='id';cand=null;save();render();ui()}
};

/* ---------- 匯入／匯出 ---------- */
let mode='';
const dlg=$('#dlg');
function openDlg(m){
  mode=m;$('#dok').hidden=false;
  if(m==='imp'){$('#dt').textContent='匯入清單';$('#dh').textContent='每行一筆：構件名稱,編號（可從 Excel 兩欄直接複製貼上）。沒有編號的構件只寫名稱即可。匯入後會取代現有清單。';$('#ta').value=dump();$('#dok').textContent='匯入'}
  else{$('#dt').textContent='執行結果';$('#dh').textContent='格式：構件名稱,編號,執行時間。可貼到 Excel 或 LINE 保存。';$('#ta').value=dump();$('#dok').textContent='複製'}
  dlg.showModal();
}
$('#imp').onclick=()=>openDlg('imp');
$('#exp').onclick=()=>openDlg('exp');
$('#dcl').onclick=()=>dlg.close();
$('#dok').onclick=async()=>{
  if(mode==='imp'){
    const n=parse($('#ta').value);
    if(!n.length){alert('沒有讀到有效資料');return}
    items=n;sel=null;state='name';cand=null;save();render();ui();dlg.close();
  }else{
    const ta=$('#ta');ta.select();
    try{await navigator.clipboard.writeText(ta.value);$('#dh').textContent='已複製到剪貼簿。'}
    catch(e){try{document.execCommand('copy');$('#dh').textContent='已複製到剪貼簿。'}catch(_){$('#dh').textContent='請長按文字手動複製。'}}
  }
};
$('#rst').onclick=()=>{
  if(!confirm('確定清除所有「已執行」紀錄？'))return;
  items.forEach(x=>x.t=null);save();render();
};

load();render();ui();
</script>
</body>
